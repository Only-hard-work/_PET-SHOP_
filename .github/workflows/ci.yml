name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18.9.1"
          cash: "npm"

      - name: Install dependencies
        run: npm ci
        working-directory: ./server

      - name: Type-check
        run: npm run typecheck
        working-directory: ./server

      - name: Lint
        run: npm run lint
        working-directory: ./server

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18.9.1"
          cash: "npm"

      - name: Install dependencies
        run: npm ci
        working-directory: ./client

      - name: Type-check
        run: npm run typecheck
        working-directory: ./client

      - name: Lint
        run: npm run lint
        working-directory: ./client

      - name: Build
        run: npm run build
        working-directory: ./client
